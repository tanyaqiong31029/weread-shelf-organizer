# 工程规范配置：包元数据 + lint/类型检查配置节。
# 标准库零依赖; [project] 使其在各 Agent 环境中可 pip 安装与升级, 并提供 weread-shelf CLI。
[tool.ruff]
line-length = 100
target-version = "py311" # 与 CI(.github/workflows/test.yml) 的 Python 版本一致

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# 测试文件保持原样：
#   N812   — `import weread_shelf as W` 短别名贯穿全文件，重命名属无谓改动
#   SIM117 — mock 上下文与 assertRaises 的嵌套 with 为既定结构，改写属逻辑级重构
"tests/*" = ["N812", "SIM117"]

# ---- 类型检查（宽松档：标准库动态脚本，不做 strict 约束）----
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

# ---- 包元数据（可安装、可升级）----
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weread-shelf-organizer"
version = "1.2.1"
description = "微信读书书架自动整理 Skill — 重组(白名单确认)/增量归类/分组管理/迁移核验"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "tanyaqiong31029" }]
keywords = ["weread", "wechat-reading", "shelf", "agent-skill", "automation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: MacOS",
  "Topic :: Utilities",
]

[project.scripts]
weread-shelf = "weread_shelf:main"

[tool.setuptools]
package-dir = { "" = "scripts" }
py-modules = ["weread_shelf"]
